<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>九九ギャラクシー | KUKU GALAXY BLASTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--cy:#59f3ff;--pk:#ff5fd2;--yl:#ffe45e;--bg:#07031c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(circle at 50% 30%,#1a0a45,#050212 70%);color:#fff;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Arial Rounded MT Bold",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:960/600;width:min(100vw,calc(100vh*960/600));max-height:100vh}
  canvas{width:100%;height:100%;display:block;border-radius:14px;background:#120a30;touch-action:none;
    box-shadow:0 0 0 2px rgba(89,243,255,.35),0 0 40px rgba(255,95,210,.25)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,2,22,.55);border-radius:14px;backdrop-filter:blur(3px)}
  .overlay.hidden,.hidden{display:none!important}
  .panel{width:min(94%,700px);max-height:97%;overflow:auto;padding:20px 26px;text-align:center;
    background:linear-gradient(160deg,rgba(52,22,120,.93),rgba(14,6,56,.95));
    border:2px solid var(--cy);border-radius:24px;
    box-shadow:0 0 0 4px rgba(89,243,255,.12),0 0 40px rgba(89,243,255,.4),inset 0 0 30px rgba(255,95,210,.15)}
  .logo{font-family:"Dela Gothic One","Hiragino Maru Gothic ProN",sans-serif;font-weight:400;
    font-size:clamp(34px,7.4vw,64px);line-height:1.05;letter-spacing:2px;
    background:linear-gradient(180deg,#fff 5%,var(--yl) 45%,#ff7a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,150,40,.7)) drop-shadow(0 3px 0 #7a1c8a)}
  .eng{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(11px,2vw,16px);letter-spacing:.32em;color:var(--cy);
    text-shadow:0 0 12px var(--cy);margin:2px 0 10px}
  h2{font-family:"Dela Gothic One","Hiragino Maru Gothic ProN",sans-serif;font-weight:400;font-size:clamp(24px,4.4vw,36px);
    color:var(--yl);text-shadow:0 0 16px rgba(255,160,0,.7);margin-bottom:8px}
  .lbl{font-size:13px;color:var(--cy);margin:12px 0 6px;font-weight:bold;letter-spacing:.08em}
  .dans,.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .chip{padding:7px 13px;border-radius:999px;border:2px solid rgba(89,243,255,.7);background:rgba(0,0,0,.2);color:#fff;
    font:inherit;font-size:15px;cursor:pointer;transition:.12s}
  .chip:hover{background:rgba(89,243,255,.2)}
  .chip.on{background:linear-gradient(var(--cy),#2aa8ff);color:#08123a;font-weight:bold;border-color:#fff;box-shadow:0 0 14px rgba(89,243,255,.7)}
  .chip.small{font-size:12px;padding:4px 10px;border-color:#a98bff}
  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lv{padding:8px 4px 7px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;
    font:inherit;cursor:pointer;transition:.12s;line-height:1.25}
  .lv:hover{transform:translateY(-2px);border-color:var(--cy)}
  .lv b{display:block;font-family:Orbitron,sans-serif;font-weight:900;font-size:20px}
  .lv span{display:block;font-size:11px;color:#cfd8ff}
  .lv i{display:block;font-style:normal;font-size:10px;color:var(--yl);letter-spacing:1px}
  .lv.on{border-color:#fff;background:linear-gradient(160deg,#ff5fd2,#7b3cff);box-shadow:0 0 18px rgba(255,95,210,.8)}
  .lvinfo{margin-top:7px;font-size:13px;color:var(--yl)}
  .btn{margin-top:14px;padding:12px 34px;font-family:"Dela Gothic One","Hiragino Maru Gothic ProN",sans-serif;font-size:22px;color:#2b1200;
    background:linear-gradient(#fff08a,#ffa21f);border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 5px 0 #b35a00,0 0 22px rgba(255,170,0,.7)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b35a00}
  .btn.sub{background:linear-gradient(#8ff6ff,#2aa8ff);box-shadow:0 5px 0 #0b5fa0,0 0 18px rgba(89,243,255,.6);font-size:18px;padding:10px 26px}
  .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.8);box-shadow:none;font-size:16px;padding:9px 20px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
  .help{margin-top:12px;font-size:12px;color:#cfd8ff;line-height:1.8}
  kbd{background:#fff;color:#150a40;border-radius:5px;padding:1px 7px;font-weight:bold;font-size:11px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px}
  .stat b{display:block;font-family:Orbitron,sans-serif;font-size:24px;color:var(--yl)}
  .stat span{font-size:12px;color:#cfd8ff}
  .miss{margin-top:8px;font-size:15px;line-height:1.9}
  .miss span{display:inline-block;margin:2px 4px;padding:2px 10px;border-radius:10px;background:rgba(255,80,110,.25);border:1px solid #ff6b88}
  .best{font-size:13px;color:var(--yl);margin-top:6px}
  #hudBtns{position:absolute;right:2.2%;top:19.5%;display:flex;gap:8px;z-index:5}
  .ib{width:44px;height:44px;border-radius:50%;border:2px solid var(--cy);background:rgba(8,4,40,.7);color:#fff;font-size:20px;cursor:pointer;
    box-shadow:0 0 12px rgba(89,243,255,.5);display:flex;align-items:center;justify-content:center;transition:.12s}
  .ib:hover{background:rgba(89,243,255,.3);transform:scale(1.08)}
  @media (max-width:640px){.panel{padding:14px 12px}.lv b{font-size:16px}.lv span{font-size:9px}.ib{width:38px;height:38px;font-size:17px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>

    <div id="hudBtns" class="hidden">
      <button class="ib" id="pauseBtn" title="ていし (P / Esc)" aria-label="ていし">⏸</button>
      <button class="ib" id="homeBtn" title="ホームへ" aria-label="ホームへ">🏠</button>
    </div>

    <div id="menu" class="overlay">
      <div class="panel">
        <div class="logo">九九ギャラクシー</div>
        <div class="eng">KUKU GALAXY BLASTER</div>
        <div class="lbl">レベルをえらぶ(レベルがあがると はやく、こたえのブロックもふえるよ)</div>
        <div class="levels" id="levels"></div>
        <div class="lvinfo" id="lvInfo"></div>
        <div class="lbl">れんしゅうする「だん」</div>
        <div class="dans" id="dans"></div>
        <div class="row" style="margin-top:8px">
          <button class="chip small" id="allDans">ぜんぶ</button>
          <button class="chip small" id="lowDans">1〜5のだん</button>
          <button class="chip small" id="highDans">6〜9のだん</button>
        </div>
        <div class="lbl">モード</div>
        <div class="row" id="modes"></div>
        <button class="btn" id="startBtn">スタート!</button>
        <div class="best" id="bestLine"></div>
        <div class="help">
          <kbd>←</kbd> <kbd>→</kbd> でブロックをえらぶ ／ <kbd>Space</kbd> か <kbd>↓</kbd> ですぐ発射(はやいほどボーナス)<br>
          <kbd>P</kbd> か <kbd>Esc</kbd> でていし ／ <kbd>M</kbd> でおと ON/OFF ／ メニューで <kbd>1</kbd>〜<kbd>5</kbd> でレベルへんこう<br>
          タッチ: ブロックの下あたりをタップでえらぶ、もういちどタップで発射
        </div>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel" style="width:min(86%,460px)">
        <h2>⏸ いちじていし</h2>
        <div class="btns" style="flex-direction:column">
          <button class="btn" id="resumeBtn">▶ つづける</button>
          <button class="btn sub" id="restartBtn">🔄 はじめからやりなおす</button>
          <button class="btn ghost" id="pauseHomeBtn">🏠 ホームへもどる</button>
        </div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2 id="resTitle">けっか</h2>
        <div id="resRank" style="font-size:20px;margin-bottom:4px"></div>
        <div class="stats">
          <div class="stat"><b id="resScore">0</b><span>スコア</span></div>
          <div class="stat"><b id="resCombo">0</b><span>さいだいコンボ</span></div>
          <div class="stat"><b id="resAcc">0%</b><span>せいかいりつ</span></div>
        </div>
        <div id="resBest" class="best"></div>
        <div id="resMiss" class="miss"></div>
        <div class="btns">
          <button class="btn" id="againBtn">もういちど</button>
          <button class="btn sub hidden" id="nextLvBtn">つぎのレベルへ ▶</button>
          <button class="btn ghost" id="menuBtn">ホームへ</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ====================== 基本設定 ======================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 600;
const CX = W / 2, HOR = 190, GROUND = 500;
const DJ = 0.08;              // 判定距離
const TOTAL_Q = 20;           // 1ラウンドの問題数
const F = {
  jp:  s => `${s}px "Dela Gothic One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`,
  num: s => `900 ${s}px Orbitron,"Dela Gothic One","Hiragino Sans",sans-serif`,
};
try { if (document.fonts) { document.fonts.load('20px "Dela Gothic One"'); document.fonts.load('900 20px Orbitron'); } } catch (e) {}

// [明るい色, 濃い色, ハイライト]
const PALETTE = [
  ['#38d6ff', '#0b5fd6', '#b4f4ff'], ['#ffb23d', '#e04e0b', '#ffe3a8'], ['#c77dff', '#6a1fd6', '#efd0ff'],
  ['#4dffb0', '#06995f', '#c0ffe4'], ['#ff6fa8', '#c4125f', '#ffc6de'], ['#ffe45e', '#d19a00', '#fff6b0'],
];
// n: こたえのブロック数, T: 手前に来るまでの秒数
const LEVELS = [
  { n: 2, T: 9.0, name: 'はじめて',     stars: '★☆☆☆☆' },
  { n: 3, T: 7.0, name: 'なれてきた',   stars: '★★☆☆☆' },
  { n: 4, T: 5.6, name: 'いちにんまえ', stars: '★★★☆☆' },
  { n: 5, T: 4.4, name: 'たつじん',     stars: '★★★★☆' },
  { n: 6, T: 3.5, name: 'でんせつ',     stars: '★★★★★' },
];
const MODES = [
  { id: 'life',     label: '❤️ ライフ3つ' },
  { id: 'practice', label: '📖 れんしゅう(ライフなし)' },
];

// ====================== 保存データ ======================
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

const settings = Object.assign({ dans: [2,3,4,5,6,7,8,9], level: 2, mode: 'life' }, load('kuku2-settings', {}));
if (!(settings.level >= 1 && settings.level <= 5)) settings.level = 2;
if (!Array.isArray(settings.dans) || !settings.dans.length) settings.dans = [2,3,4,5,6,7,8,9];
let weak = load('kuku-weak', {});     // "a×b" -> 苦手度
let bests = load('kuku2-best', {});   // 設定キー -> ベストスコア

// ====================== 音 ======================
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  move()  { tone(420, 0.05, 'triangle', 0.04); },
  shoot() { tone(1000, 0.18, 'sawtooth', 0.04, -700); },
  boom()  { tone(200, 0.35, 'sawtooth', 0.07, -150); tone(90, 0.3, 'square', 0.05, -40, 0.03); },
  ok(combo) {
    const f = 523 * Math.pow(2, Math.min(combo, 12) / 12);
    tone(f, 0.12, 'square', 0.05); tone(f * 1.5, 0.18, 'square', 0.05, 0, 0.08);
  },
  ng()    { tone(150, 0.45, 'sawtooth', 0.09, -90); },
  mult()  { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0.1, 'triangle', 0.06, 0, i * 0.06)); },
  fin()   { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'square', 0.05, 0, i * 0.12)); },
  click() { tone(660, 0.06, 'triangle', 0.05); },
};

// ====================== 状態 ======================
let state = 'menu';      // 'menu' | 'playing' | 'paused' | 'result'
let G = null;            // ゲーム状態
let N = 3, LW = 250;     // レーン数と、手前でのレーン間隔
let scroll = 0;          // 床の流れ
let laneF = 1;           // 表示用のレーン位置(なめらか)
let lane = 1;            // 現在のレーン 0..N-1
let flowNow = 0.25;
let shake = 0, flash = 0, flashColor = '#fff';
let particles = [], floats = [];
let tAll = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const stars = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: Math.random() * (HOR - 8), r: rnd(.4, 2), tw: rnd(0, 6), sp: rnd(.5, 2.2) }));
const skyline = (() => { // 地平線のまちなみ
  const a = []; let x = -10;
  while (x < W + 10) { const w = rnd(14, 42), h = rnd(10, 46); a.push({ x, w, h, win: Math.random() < .6 }); x += w + rnd(0, 6); }
  return a;
})();
const streaks = Array.from({ length: 34 }, () => ({ a: rnd(0.08, Math.PI - 0.08), ph: Math.random(), sp: rnd(.6, 1.2) }));

function setLanes(n) { N = n; LW = n <= 3 ? 250 : n === 4 ? 205 : n === 5 ? 172 : 148; }
const laneOff = i => i - (N - 1) / 2;
const curLevel = () => LEVELS[settings.level - 1];

function newGame() {
  setLanes(curLevel().n);
  G = {
    score: 0, combo: 0, maxCombo: 0, lives: settings.mode === 'practice' ? Infinity : 3,
    qIndex: 0, correct: 0, wrong: 0, mistakes: [], asked: {}, prevKey: '',
    row: null, boost: false, mult: 1,
  };
  particles = []; floats = [];
  lane = Math.floor((N - 1) / 2); laneF = lane;
  nextQuestion();
}

// ====================== 出題 ======================
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickQuestion() {
  const pool = [];
  for (const a of settings.dans) for (let b = 1; b <= 9; b++) {
    const key = a + '×' + b;
    if (key === G.prevKey && settings.dans.length * 9 > 1) continue;
    const w = (1 + (weak[key] || 0) * 2) / (1 + (G.asked[key] || 0) * 2);
    pool.push({ a, b, key, w });
  }
  let sum = pool.reduce((s, p) => s + p.w, 0), r = Math.random() * sum;
  for (const p of pool) { r -= p.w; if (r <= 0) return p; }
  return pool[pool.length - 1];
}
function makeChoices(a, b, n) {
  const ans = a * b;
  const cand = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 10, ans - 10, ans + 2, ans - 2, a + b, ans + a, ans - a, ans + b, ans - b];
  if (ans >= 10) cand.push(parseInt(String(ans).split('').reverse().join(''), 10));
  const pool = shuffle([...new Set(cand)].filter(v => v > 0 && v !== ans && v <= 99));
  const wrongs = pool.slice(0, n - 1);
  let guard = 0;
  while (wrongs.length < n - 1 && guard++ < 300) {
    const v = Math.max(1, ans + Math.floor(rnd(-16, 17)));
    if (v !== ans && v <= 99 && !wrongs.includes(v)) wrongs.push(v);
  }
  let extra = 90; while (wrongs.length < n - 1) wrongs.push(extra++);
  const ci = Math.floor(Math.random() * n);
  const nums = []; let k = 0;
  for (let i = 0; i < n; i++) nums.push(i === ci ? ans : wrongs[k++]);
  return { nums, ci };
}
function nextQuestion() {
  const lv = curLevel();
  const q = pickQuestion();
  const { nums, ci } = makeChoices(q.a, q.b, lv.n);
  G.prevKey = q.key; G.asked[q.key] = (G.asked[q.key] || 0) + 1;
  const T = lv.T * Math.max(0.65, 1 - G.combo * 0.02);
  G.row = {
    q, T, d: 1.0, age: 0, phase: 'approach', t: 0,
    ci, chosen: -1, ok: false, bonus: 0, remainFrac: 1, pending: false,
    blocks: nums.map((num, i) => ({ num, alive: true })),
  };
}

// ====================== 入力 ======================
function moveLane(dir) {
  if (state !== 'playing') return;
  const n = clamp(lane + dir, 0, N - 1);
  if (n !== lane) { lane = n; sfx.move(); }
}
function fireNow(on) { if (state === 'playing') G.boost = on; }
function setPause(on) {
  if (on && state === 'playing') { state = 'paused'; G.boost = false; $('pause').classList.remove('hidden'); }
  else if (!on && state === 'paused') { state = 'playing'; $('pause').classList.add('hidden'); }
}

window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) e.preventDefault();
  initAudio();
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (state === 'menu') {
    if (k === 'Enter') startGame();
    else if (k >= '1' && k <= '5') { settings.level = +k; persist(); buildMenu(); sfx.click(); }
    return;
  }
  if (state === 'result') { if (k === 'Enter') startGame(); else if (k === 'Escape') showMenu(); return; }
  if (state === 'paused') { if (k === 'Escape' || k === 'p' || k === 'P' || k === 'Enter') setPause(false); return; }
  // playing
  if (k === 'Escape' || k === 'p' || k === 'P') { setPause(true); return; }
  if (e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight')) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') moveLane(1);
  else if (k === ' ' || k === 'ArrowDown') fireNow(true);
});
window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowDown') fireNow(false); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
window.addEventListener('blur', () => setPause(true));

cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'playing') return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const target = clamp(Math.round((x - CX) / LW + (N - 1) / 2), 0, N - 1);
  if (target === lane) { fireNow(true); setTimeout(() => fireNow(false), 400); }
  else { lane = target; sfx.move(); }
});

// ====================== メニュー ======================
const $ = id => document.getElementById(id);
function persist() { save('kuku2-settings', settings); }
function bestKey() { return settings.dans.join('') + '|L' + settings.level + '|' + settings.mode; }
function buildMenu() {
  const lv = $('levels'); lv.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lv' + (settings.level === i + 1 ? ' on' : '');
    b.innerHTML = `<b>Lv${i + 1}</b><span>${L.name}</span><i>${L.stars}</i>`;
    b.onclick = () => { settings.level = i + 1; persist(); sfx.click(); buildMenu(); b.blur(); };
    lv.appendChild(b);
  });
  const L = curLevel();
  $('lvInfo').textContent = `Lv${settings.level} ${L.name}: こたえのブロック ${L.n}つ ／ ${L.T <= 4.4 ? 'とてもはやい' : L.T <= 5.6 ? 'はやい' : L.T <= 7 ? 'ふつう' : 'ゆっくり'}スピード`;
  const dansEl = $('dans'); dansEl.innerHTML = '';
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button');
    b.className = 'chip' + (settings.dans.includes(d) ? ' on' : '');
    b.textContent = d + 'のだん';
    b.onclick = () => {
      const i = settings.dans.indexOf(d);
      if (i >= 0) { if (settings.dans.length > 1) settings.dans.splice(i, 1); } else settings.dans.push(d);

// ====================== 更新 ======================
function addBurst(x, y, color, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 320) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70, life: rnd(.5, 1.1), max: 1.1, color, size: rnd(2, 7) });
  }
}
function addFloat(text, x, y, color, size = 36) { floats.push({ text, x, y, life: 1.1, color, size }); }
function proj(l, d) { const s = 1 / (1 + 5 * d); return { x: CX + l * LW * s, y: HOR + (GROUND - HOR) * s, s }; }
const multOf = c => 1 + Math.min(4, Math.floor(c / 5));
const blockW = () => Math.min(LW * 0.8, 200);

function judge(row) {
  row.phase = 'resolve'; row.t = 0; row.d = DJ;
  row.chosen = lane;
  row.ok = row.chosen === row.ci;
  const p = proj(laneOff(lane), DJ);
  sfx.shoot();
  if (row.ok) {
    G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const prevMult = G.mult; G.mult = multOf(G.combo);
    row.bonus = Math.round(50 * row.remainFrac);
    const pts = (100 + 20 * (settings.level - 1) + row.bonus) * G.mult;
    G.score += pts;
    weak[row.q.key] = Math.max(0, (weak[row.q.key] || 0) - 1);
    addFloat('+' + pts, p.x, p.y - 100 * p.s, '#ffe45e', 44);
    if (row.bonus >= 35) addFloat('はやい!', p.x, p.y - 150 * p.s, '#7df9ff', 28);
    if (G.mult > prevMult) { addFloat('×' + G.mult + ' ボーナス!', CX, 300, '#ff7ae0', 52); sfx.mult(); }
    row.pending = true;
  } else {
    G.wrong++; G.combo = 0; G.mult = 1; G.lives--;
    G.mistakes.push(row.q);
    weak[row.q.key] = Math.min(5, (weak[row.q.key] || 0) + 2);
    shake = 0.5; flash = 0.35; flashColor = '#ff2a55';
    sfx.ng();
    addFloat('おしい!', p.x, p.y - 100 * p.s, '#ff6b88', 44);
  }
  save('kuku-weak', weak);
}

function update(dt) {
  tAll += dt;
  laneF += (lane - laneF) * Math.min(1, dt * 14);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 50 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);

  let flow = 0.25;
  if (state === 'playing' && G.row) {
    const row = G.row;
    row.age += dt;
    if (row.phase === 'approach') {
      let v = (1 - DJ) / row.T;
      if (G.boost) v *= 3.5;
      row.remainFrac = clamp((row.d - DJ) / (1 - DJ), 0, 1);
      row.d -= v * dt; flow = v;
      if (row.d <= DJ) { row.remainFrac = clamp((row.d + v * dt - DJ) / (1 - DJ), 0, 1); judge(row); }
    } else {
      row.t += dt;
      if (row.ok) {
        flow = 0.4 + Math.min(1.8, row.t * 3.5);
        if (row.pending) {
          row.pending = false;
          row.blocks.forEach((b, i) => {
            const p = proj(laneOff(i), DJ);
            const chosen = i === row.chosen;
            b.alive = false;
            const col = PALETTE[i % 6][0];
            addBurst(p.x, p.y - 45 * p.s, col, chosen ? 46 : 18, chosen ? 1.2 : 0.8);
            addBurst(p.x, p.y - 45 * p.s, '#ffffff', chosen ? 16 : 6, 0.9);
          });
          sfx.boom(); sfx.ok(G.combo);
          shake = 0.14; flash = 0.12; flashColor = '#ffffff';
        }
        if (row.t > 0.6) endRow();
      } else {
        flow = 0;
        if (row.t > 1.7) endRow();
      }
    }
  }
  flowNow = flow;
  scroll += flow * dt;
}
function endRow() {
  G.qIndex++;
  if (G.lives <= 0) { finishGame(true); return; }
  if (G.qIndex >= TOTAL_Q) { finishGame(false); return; }
  G.boost = false;
  nextQuestion();
}

}
function glassPlate(x, y, w, h, r, glow) {
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = 22;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(34,16,92,.86)'); g.addColorStop(1, 'rgba(10,5,44,.9)');
  ctx.fillStyle = g; rr(x, y, w, h, r); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = glow; rr(x, y, w, h, r); ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  const row = G.row, lv = curLevel();
  // 問題
  const bw = 420, bh = 84, bx = CX - bw / 2, by = 14;
  glassPlate(bx, by, bw, bh, 22, '#59f3ff');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = F.num(54); ctx.fillStyle = '#fff'; ctx.shadowColor = '#59f3ff'; ctx.shadowBlur = 14;
  ctx.fillText(`${row.q.a} × ${row.q.b} = ?`, CX, by + bh / 2 + 3);
  ctx.shadowBlur = 0;
  // 時間ゲージ
  const frac = row.phase === 'approach' ? clamp((row.d - DJ) / (1 - DJ), 0, 1) : 0;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(bx + 14, by + bh + 8, bw - 28, 10, 5); ctx.fill();
  if (frac > 0) {
    const col = frac > 0.5 ? '#59f3ff' : frac > 0.25 ? '#ffe45e' : '#ff6b88';
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fillStyle = col; rr(bx + 14, by + bh + 8, (bw - 28) * frac, 10, 5); ctx.fill(); ctx.restore();
  }
  // スコア
  ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = F.num(14); ctx.fillStyle = '#b7c4ff'; ctx.fillText('SCORE', 24, 30);
  ctx.font = F.num(38); ctx.fillStyle = '#ffe45e'; ctx.fillText(String(G.score), 24, 68);
  if (G.combo >= 2) {
    ctx.font = F.jp(24); ctx.fillStyle = '#ff7ae0';
    ctx.fillText(`🔥 ${G.combo} コンボ`, 24, 106);
    ctx.font = F.num(19); ctx.fillStyle = '#7df9ff';
    ctx.fillText(`POINT ×${G.mult}`, 24, 134);
    if (G.mult < 5) {
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(24, 144, 140, 8, 4); ctx.fill();
      ctx.fillStyle = '#ff7ae0'; rr(24, 144, 140 * (G.combo % 5) / 5, 8, 4); ctx.fill();
    }
  }
  // レベル・進行・ライフ
  ctx.textAlign = 'right';
  ctx.font = F.num(17); ctx.fillStyle = '#59f3ff'; ctx.fillText(`Lv${settings.level}`, W - 24, 30);
  ctx.font = F.jp(15); ctx.fillStyle = '#cfd8ff'; ctx.fillText(lv.name, W - 66, 30);
  ctx.font = F.jp(16); ctx.fillText(`もんだい ${Math.min(G.qIndex + 1, TOTAL_Q)} / ${TOTAL_Q}`, W - 24, 56);
  if (G.lives !== Infinity) {
    ctx.font = '28px sans-serif'; ctx.textBaseline = 'middle';
    let s = ''; for (let i = 0; i < 3; i++) s += i < G.lives ? '❤️' : '🖤';
    ctx.fillText(s, W - 24, 90);
  } else { ctx.font = F.jp(15); ctx.fillStyle = '#7df9ff'; ctx.fillText('れんしゅうモード', W - 24, 86); }
  ctx.restore();
  // 不正解のこたえ
  if (row.phase === 'resolve' && !row.ok) {
    glassPlate(CX - 230, 270, 460, 78, 18, '#69ff9c');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9dffbc'; ctx.font = F.num(38);
    ctx.fillText(`${row.q.a} × ${row.q.b} = ${row.q.a * row.q.b}`, CX, 310);
  }
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 30, (Math.random() - .5) * shake * 30);
  drawBackground(); drawFloor(); drawSpeedLines();
  if (state !== 'menu' && G && G.row) {
    const row = G.row;
    for (let i = 0; i < row.blocks.length; i++) { const b = row.blocks[i]; if (b.alive) drawBlock(b, i, row); }
    drawBeam();
  }
  drawShip();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.restore(); ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life * 1.6, 0, 1);
    ctx.font = F.num(f.size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (state !== 'menu' && G && G.row) drawHUD();
  // ビネット
  const vg = ctx.createRadialGradient(CX, H / 2, H * 0.45, CX, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,10,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.globalAlpha = clamp(flash * 1.6, 0, 0.5); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.restore();
}

// ====================== メインループ ======================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
setLanes(curLevel().n); lane = laneF = Math.floor((N - 1) / 2);
buildMenu();
requestAnimationFrame(frame);
window.__kuku = { get state() { return state; }, get G() { return G; }, get lane() { return lane; } };  // 動作確認用
})();
</script>
