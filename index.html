<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>九九シューター</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0620;color:#fff;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Arial Rounded MT Bold",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:960/600;width:min(100vw,calc(100vh*960/600));max-height:100vh}
  canvas{width:100%;height:100%;display:block;border-radius:12px;background:#120a30;touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,4,28,.62);border-radius:12px;backdrop-filter:blur(2px)}
  .overlay.hidden{display:none}
  .panel{width:min(92%,640px);max-height:96%;overflow:auto;padding:22px 26px;text-align:center;
    background:linear-gradient(160deg,rgba(60,30,130,.95),rgba(20,10,70,.95));
    border:3px solid #7df9ff;border-radius:22px;box-shadow:0 0 30px rgba(125,249,255,.45)}
  h1{font-size:clamp(26px,5vw,42px);color:#ffe45e;text-shadow:0 0 14px #ff7a00;margin-bottom:4px}
  h2{font-size:clamp(22px,4vw,32px);color:#ffe45e;margin-bottom:8px}
  .sub{font-size:14px;color:#cfd8ff;margin-bottom:12px}
  .lbl{font-size:14px;color:#7df9ff;margin:10px 0 6px;font-weight:bold}
  .dans{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .chip{padding:7px 12px;border-radius:999px;border:2px solid #7df9ff;background:transparent;color:#fff;
    font:inherit;font-size:15px;cursor:pointer}
  .chip.on{background:#7df9ff;color:#150a40;font-weight:bold}
  .chip.small{font-size:13px;padding:5px 10px;border-color:#a98bff}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{margin-top:14px;padding:12px 30px;font:inherit;font-size:22px;font-weight:bold;color:#2b1200;
    background:linear-gradient(#ffe45e,#ff9f1a);border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 5px 0 #b35a00,0 0 18px rgba(255,170,0,.6)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b35a00}
  .btn.ghost{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none;font-size:16px;padding:9px 20px;margin-left:8px}
  .help{margin-top:12px;font-size:13px;color:#cfd8ff;line-height:1.7}
  kbd{background:#fff;color:#150a40;border-radius:5px;padding:1px 7px;font-weight:bold;font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px}
  .stat b{display:block;font-size:24px;color:#ffe45e}
  .stat span{font-size:12px;color:#cfd8ff}
  .miss{margin-top:8px;font-size:15px;line-height:1.9}
  .miss span{display:inline-block;margin:2px 4px;padding:2px 10px;border-radius:10px;background:rgba(255,80,110,.25);border:1px solid #ff6b88}
  .best{font-size:13px;color:#ffe45e;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1>🚀 九九シューター</h1>
        <p class="sub">こたえのブロックをえらんで、うちぬけ!</p>
        <div class="lbl">れんしゅうする「だん」</div>
        <div class="dans" id="dans"></div>
        <div class="row" style="margin-top:8px">
          <button class="chip small" id="allDans">ぜんぶ</button>
          <button class="chip small" id="lowDans">1〜5のだん</button>
          <button class="chip small" id="highDans">6〜9のだん</button>
        </div>
        <div class="lbl">はやさ</div>
        <div class="row" id="speeds"></div>
        <div class="lbl">モード</div>
        <div class="row" id="modes"></div>
        <button class="btn" id="startBtn">スタート (Enter)</button>
        <div class="best" id="bestLine"></div>
        <div class="help">
          <kbd>←</kbd> <kbd>→</kbd> でレーンをえらぶ ／ <kbd>Space</kbd> か <kbd>↓</kbd> でいますぐ発射(はやいほどボーナス)<br>
          れんぞくせいかいで コンボ ×2 ×3 …とポイントアップ ／ <kbd>M</kbd> で おと ON/OFF<br>
          タブレットは ゲーム画面の左・中・右をタップ(同じレーンをもう一度タップで発射)
        </div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2 id="resTitle">けっか</h2>
        <div id="resRank" style="font-size:20px;margin-bottom:4px"></div>
        <div class="stats">
          <div class="stat"><b id="resScore">0</b><span>スコア</span></div>
          <div class="stat"><b id="resCombo">0</b><span>さいだいコンボ</span></div>
          <div class="stat"><b id="resAcc">0%</b><span>せいかいりつ</span></div>
        </div>
        <div id="resBest" class="best"></div>
        <div id="resMiss" class="miss"></div>
        <button class="btn" id="againBtn">もういちど (Enter)</button>
        <button class="btn ghost" id="menuBtn">メニューへ (Esc)</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ====================== 基本設定 ======================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 600;
const CX = W / 2, HOR = 190, GROUND = 500;
const LANE_W = 250;           // 手前(s=1)でのレーン間隔
const DJ = 0.08;              // 判定距離
const TOTAL_Q = 20;           // 1ラウンドの問題数
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Arial Rounded MT Bold",sans-serif';
const LANE_COLORS = [['#4fc3ff','#1769d6'], ['#ffb84d','#e0600b'], ['#c58bff','#7a2bd6']];

const SPEEDS = [
  { id: 'easy',   label: 'ゆっくり', T: 8.0 },
  { id: 'normal', label: 'ふつう',   T: 5.5 },
  { id: 'hard',   label: 'はやい',   T: 3.8 },
];
const MODES = [
  { id: 'life',     label: '❤️ ライフ3つ' },
  { id: 'practice', label: '📖 れんしゅう(ライフなし)' },
];

// ====================== 保存データ ======================
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

const settings = Object.assign({ dans: [2,3,4,5,6,7,8,9], speed: 'normal', mode: 'life' }, load('kuku-settings', {}));
let weak = load('kuku-weak', {});     // "a×b" -> 苦手度
let bests = load('kuku-best', {});    // 設定キー -> ベストスコア

// ====================== 音 ======================
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  move()  { tone(420, 0.05, 'triangle', 0.04); },
  shoot() { tone(1000, 0.18, 'sawtooth', 0.04, -700); },
  boom()  { tone(200, 0.35, 'sawtooth', 0.07, -150); tone(90, 0.3, 'square', 0.05, -40, 0.03); },
  ok(combo) {
    const f = 523 * Math.pow(2, Math.min(combo, 12) / 12);
    tone(f, 0.12, 'square', 0.05); tone(f * 1.5, 0.18, 'square', 0.05, 0, 0.08);
  },
  ng()    { tone(150, 0.45, 'sawtooth', 0.09, -90); },
  mult()  { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0.1, 'triangle', 0.06, 0, i * 0.06)); },
  fin()   { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'square', 0.05, 0, i * 0.12)); },
};

// ====================== 状態 ======================
let state = 'menu';      // 'menu' | 'playing' | 'result'
let G = null;            // ゲーム状態
let scroll = 0;          // 床の流れ
let laneF = 0;           // 表示用のレーン位置(なめらか)
let lane = 0;            // 現在のレーン -1,0,1
let shake = 0, flash = 0, flashColor = '#fff';
let particles = [], floats = [];
let tAll = 0;
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * (HOR - 10), r: Math.random() * 1.6 + .3, tw: Math.random() * 6 }));

function newGame() {
  G = {
    score: 0, combo: 0, maxCombo: 0, lives: settings.mode === 'practice' ? Infinity : 3,
    qIndex: 0, correct: 0, wrong: 0, mistakes: [], asked: {}, prevKey: '',
    row: null, boost: false, warp: 0, mult: 1,
  };
  particles = []; floats = []; lane = 0; laneF = 0;
  nextQuestion();
}

// ====================== 出題 ======================
function pickQuestion() {
  const pool = [];
  for (const a of settings.dans) for (let b = 1; b <= 9; b++) {
    const key = a + '×' + b;
    if (key === G.prevKey) continue;
    const w = (1 + (weak[key] || 0) * 2) / (1 + (G.asked[key] || 0) * 2);
    pool.push({ a, b, key, w });
  }
  let sum = pool.reduce((s, p) => s + p.w, 0), r = Math.random() * sum;
  for (const p of pool) { r -= p.w; if (r <= 0) return p; }
  return pool[pool.length - 1];
}
function makeChoices(a, b) {
  const ans = a * b;
  const c = new Set([a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 10, ans - 10, ans + 2, ans - 2, a + b]);
  if (ans >= 10) { const s = String(ans); c.add(parseInt(s.split('').reverse().join(''), 10)); }
  const cand = [...c].filter(v => v > 0 && v !== ans && v <= 99);
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const wrongs = cand.slice(0, 2);
  while (wrongs.length < 2) { const v = 2 + Math.floor(Math.random() * 80); if (v !== ans && !wrongs.includes(v)) wrongs.push(v); }
  const ci = Math.floor(Math.random() * 3);
  const nums = []; let k = 0;
  for (let i = 0; i < 3; i++) nums.push(i === ci ? ans : wrongs[k++]);
  return { nums, ci };
}
function nextQuestion() {
  const q = pickQuestion();
  const { nums, ci } = makeChoices(q.a, q.b);
  G.prevKey = q.key; G.asked[q.key] = (G.asked[q.key] || 0) + 1;
  const base = SPEEDS.find(s => s.id === settings.speed).T;
  const T = base * Math.max(0.6, 1 - G.combo * 0.02);
  G.row = {
    q, T, d: 1.0, age: 0, phase: 'approach', t: 0, done: false,
    ci, chosen: -1, ok: false, bonus: 0,
    blocks: nums.map((n, i) => ({ lane: i - 1, num: n, alive: true, hit: 0 })),
  };
}

// ====================== 入力 ======================
function moveLane(dir) {
  if (state !== 'playing') return;
  const n = Math.max(-1, Math.min(1, lane + dir));
  if (n !== lane) { lane = n; sfx.move(); }
}
function fireNow(on) { if (state === 'playing') G.boost = on; }

window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) e.preventDefault();
  initAudio();
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (state === 'menu') { if (k === 'Enter') startGame(); return; }
  if (state === 'result') { if (k === 'Enter') startGame(); else if (k === 'Escape') showMenu(); return; }
  if (k === 'Escape') { showMenu(); return; }
  if (e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight')) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') moveLane(1);
  else if (k === ' ' || k === 'ArrowDown') fireNow(true);
});
window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowDown') fireNow(false); });

cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'playing') return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const target = x < W / 3 ? -1 : x > W * 2 / 3 ? 1 : 0;
  if (target === lane) { fireNow(true); setTimeout(() => fireNow(false), 400); }
  else { lane = target; sfx.move(); }
});

// ====================== メニュー ======================
const $ = id => document.getElementById(id);
function buildMenu() {
  const dansEl = $('dans'); dansEl.innerHTML = '';
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button');
    b.className = 'chip' + (settings.dans.includes(d) ? ' on' : '');
    b.textContent = d + 'のだん';
    b.onclick = () => {
      const i = settings.dans.indexOf(d);
      if (i >= 0) { if (settings.dans.length > 1) settings.dans.splice(i, 1); } else settings.dans.push(d);
      settings.dans.sort((x, y) => x - y); persist(); buildMenu();
    };
    dansEl.appendChild(b);
  }
  const mk = (el, list, key) => {
    el.innerHTML = '';
    list.forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (settings[key] === o.id ? ' on' : '');
      b.textContent = o.label;
      b.onclick = () => { settings[key] = o.id; persist(); buildMenu(); };
      el.appendChild(b);
    });
  };
  mk($('speeds'), SPEEDS, 'speed'); mk($('modes'), MODES, 'mode');
  const b = bests[bestKey()];
  $('bestLine').textContent = b ? '🏆 この設定のベストスコア: ' + b : '';
}
function persist() { save('kuku-settings', settings); }
function bestKey() { return settings.dans.join('') + '|' + settings.speed + '|' + settings.mode; }
$('allDans').onclick = () => { settings.dans = [1,2,3,4,5,6,7,8,9]; persist(); buildMenu(); };
$('lowDans').onclick = () => { settings.dans = [1,2,3,4,5]; persist(); buildMenu(); };
$('highDans').onclick = () => { settings.dans = [6,7,8,9]; persist(); buildMenu(); };
$('startBtn').onclick = () => { initAudio(); startGame(); };
$('againBtn').onclick = () => { initAudio(); startGame(); };
$('menuBtn').onclick = showMenu;

function showMenu() {
  state = 'menu'; G = null;
  $('menu').classList.remove('hidden'); $('result').classList.add('hidden');
  buildMenu();
}
function startGame() {
  state = 'playing'; newGame();
  $('menu').classList.add('hidden'); $('result').classList.add('hidden');
}
function finishGame(gameOver) {
  state = 'result'; sfx.fin();
  const total = G.correct + G.wrong;
  const acc = total ? Math.round(G.correct / total * 100) : 0;
  const key = bestKey(); const prev = bests[key] || 0;
  const isBest = G.score > prev;
  if (isBest) { bests[key] = G.score; save('kuku-best', bests); }
  $('resTitle').textContent = gameOver ? 'ゲームオーバー' : 'クリア!';
  let rank;
  if (!gameOver && acc >= 95) rank = '🌟🌟🌟 九九マスター!';
  else if (acc >= 80) rank = '🌟🌟 すごい! もうすこしでマスター';
  else if (acc >= 50) rank = '🌟 いいちょうし! つづけよう';
  else rank = '💪 まちがえたところを おぼえよう';
  $('resRank').textContent = rank;
  $('resScore').textContent = G.score;
  $('resCombo').textContent = G.maxCombo;
  $('resAcc').textContent = acc + '%';
  $('resBest').textContent = isBest ? '🎉 ベストスコアこうしん!' : (prev ? '🏆 ベスト: ' + prev : '');
  const miss = $('resMiss');
  const uniq = [...new Map(G.mistakes.map(m => [m.key, m])).values()];
  miss.innerHTML = uniq.length
    ? 'まちがえた九九:<br>' + uniq.map(m => `<span>${m.a} × ${m.b} = ${m.a * m.b}</span>`).join('')
    : 'ぜんぶ せいかい! すばらしい!';
  $('result').classList.remove('hidden');
}

// ====================== 更新 ======================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function addBurst(x, y, color, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 280) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.5 + Math.random() * 0.6, max: 1.1, color, size: 2 + Math.random() * 5 });
  }
}
function addFloat(text, x, y, color, size = 36) { floats.push({ text, x, y, life: 1.1, color, size }); }
function proj(l, d) { const s = 1 / (1 + 5 * d); return { x: CX + l * LANE_W * s, y: HOR + (GROUND - HOR) * s, s }; }
const multOf = c => 1 + Math.min(4, Math.floor(c / 5));

function judge(row) {
  row.phase = 'resolve'; row.t = 0; row.d = DJ;
  row.chosen = lane + 1;
  row.ok = row.chosen === row.ci;
  const remain = clamp((1 - 0) * row.remainFrac, 0, 1);
  const p = proj(lane, DJ);
  sfx.shoot();
  if (row.ok) {
    G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const prevMult = G.mult; G.mult = multOf(G.combo);
    row.bonus = Math.round(50 * remain);
    const pts = (100 + row.bonus) * G.mult;
    G.score += pts;
    weak[row.q.key] = Math.max(0, (weak[row.q.key] || 0) - 1);
    addFloat('+' + pts, p.x, p.y - 100 * p.s, '#ffe45e', 44);
    if (row.bonus >= 35) addFloat('はやい!', p.x, p.y - 150 * p.s, '#7df9ff', 28);
    if (G.mult > prevMult) { addFloat('×' + G.mult + ' ボーナス!', CX, 300, '#ff7ae0', 52); sfx.mult(); }
    row.pending = true;
  } else {
    G.wrong++; G.combo = 0; G.mult = 1; G.lives--;
    G.mistakes.push(row.q);
    weak[row.q.key] = Math.min(5, (weak[row.q.key] || 0) + 2);
    shake = 0.5; flash = 0.35; flashColor = '#ff2a55';
    sfx.ng();
    addFloat('おしい!', p.x, p.y - 100 * p.s, '#ff6b88', 44);
  }
  save('kuku-weak', weak);
}

function update(dt) {
  tAll += dt;
  laneF += (lane - laneF) * Math.min(1, dt * 14);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 50 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);

  let flow = 0.25;
  if (state === 'playing' && G.row) {
    const row = G.row;
    row.age += dt;
    if (row.phase === 'approach') {
      let v = (1 - DJ) / row.T;
      if (G.boost) v *= 3.5;
      row.remainFrac = clamp((row.d - DJ) / (1 - DJ), 0, 1);
      row.d -= v * dt; flow = v;
      if (row.d <= DJ) { row.remainFrac = clamp((row.d + v * dt - DJ) / (1 - DJ), 0, 1); judge(row); }
    } else {
      row.t += dt;
      if (row.ok) {
        flow = 0.4 + Math.min(1.8, row.t * 3.5);
        if (row.pending) {
          row.pending = false;
          row.blocks.forEach((b, i) => {
            const p = proj(b.lane, DJ);
            const chosen = i === row.chosen;
            b.alive = false;
            addBurst(p.x, p.y - 45 * p.s, LANE_COLORS[i][0], chosen ? 42 : 20, chosen ? 1.2 : 0.8);
            addBurst(p.x, p.y - 45 * p.s, '#fff', chosen ? 14 : 6, 0.9);
          });
          sfx.boom(); sfx.ok(G.combo);
          shake = 0.12; flash = 0.12; flashColor = '#ffffff';
        }
        if (row.t > 0.6) endRow();
      } else {
        flow = 0;
        if (row.t > 1.7) endRow();
      }
    }
  }
  scroll += flow * dt;
}
function endRow() {
  G.qIndex++;
  if (G.lives <= 0) { finishGame(true); return; }
  if (G.qIndex >= TOTAL_Q) { finishGame(false); return; }
  G.boost = false;
  nextQuestion();
}

// ====================== 描画 ======================
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, HOR);
  g.addColorStop(0, '#07031c'); g.addColorStop(0.6, '#3a1470'); g.addColorStop(1, '#ff6fa8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR);
  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(tAll * 1.5 + s.tw));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  // サン
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, HOR); ctx.clip();
  const sg = ctx.createLinearGradient(0, HOR - 110, 0, HOR);
  sg.addColorStop(0, '#ffe45e'); sg.addColorStop(1, '#ff4fa0');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(CX, HOR, 105, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a1470';
  for (let i = 0; i < 5; i++) ctx.fillRect(CX - 110, HOR - 14 - i * 20, 220, 3 + i * 1.5);
  ctx.restore();
  // 床
  const fg = ctx.createLinearGradient(0, HOR, 0, H);
  fg.addColorStop(0, '#2a0f58'); fg.addColorStop(1, '#0d0626');
  ctx.fillStyle = fg; ctx.fillRect(0, HOR, W, H - HOR);
}
function drawFloor() {
  ctx.lineWidth = 2;
  // 横線(手前に流れてくる)
  const sp = 0.15, off = scroll % sp;
  for (let i = 0; i < 24; i++) {
    const d = i * sp - off;
    if (d < -0.05) continue;
    const p = proj(0, d);
    ctx.strokeStyle = `rgba(125,249,255,${clamp(p.s * 1.3, 0.1, 0.9)})`;
    ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(W, p.y); ctx.stroke();
  }
  // 縦線(レーン境界)
  ctx.strokeStyle = 'rgba(255,122,224,.75)';
  for (const l of [-4.5, -3.5, -2.5, -1.5, -0.5, 0.5, 1.5, 2.5, 3.5, 4.5]) {
    const a = 0.02, b = 1.35;
    ctx.globalAlpha = Math.abs(l) <= 1.5 ? 1 : 0.35;
    ctx.beginPath();
    ctx.moveTo(CX + l * LANE_W * a, HOR + (GROUND - HOR) * a);
    ctx.lineTo(CX + l * LANE_W * b, HOR + (GROUND - HOR) * b);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 現在レーンのハイライト
  if (state === 'playing') {
    const x0 = laneF - 0.5, x1 = laneF + 0.5;
    ctx.fillStyle = 'rgba(125,249,255,.13)';
    ctx.beginPath();
    ctx.moveTo(CX + x0 * LANE_W * 0.02, HOR + (GROUND - HOR) * 0.02);
    ctx.lineTo(CX + x1 * LANE_W * 0.02, HOR + (GROUND - HOR) * 0.02);
    ctx.lineTo(CX + x1 * LANE_W * 1.35, HOR + (GROUND - HOR) * 1.35);
    ctx.lineTo(CX + x0 * LANE_W * 1.35, HOR + (GROUND - HOR) * 1.35);
    ctx.closePath(); ctx.fill();
  }
  // 柱
  for (let i = 0; i < 12; i++) {
    const d = i * 0.3 - (scroll % 0.3);
    if (d < -0.03) continue;
    for (const l of [-2.2, 2.2]) {
      const p = proj(l, d), w = 26 * p.s, h = 150 * p.s;
      const a = clamp(p.s * 1.5, 0.15, 1);
      ctx.globalAlpha = a;
      const g = ctx.createLinearGradient(0, p.y - h, 0, p.y);
      g.addColorStop(0, '#ff7ae0'); g.addColorStop(1, '#6a2bd6');
      ctx.fillStyle = g; ctx.fillRect(p.x - w / 2, p.y - h, w, h);
      ctx.fillStyle = '#fff'; ctx.fillRect(p.x - w / 2, p.y - h - 4 * p.s, w, 5 * p.s);
    }
  }
  ctx.globalAlpha = 1;
}
function drawBlock(b, idx, row) {
  const p = proj(b.lane, row.d);
  const w = 190 * p.s, h = 150 * p.s;
  const x = p.x - w / 2, y = p.y - h;
  const alpha = clamp(row.age * 3, 0, 1);
  const [c1, c2] = LANE_COLORS[idx];
  const selected = row.phase === 'approach' && b.lane === lane;
  const wrongHit = row.phase === 'resolve' && !row.ok && idx === row.chosen;
  const showAnswer = row.phase === 'resolve' && !row.ok && idx === row.ci;
  ctx.globalAlpha = alpha;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 4 * p.s, w * 0.55, 12 * p.s, 0, 0, Math.PI * 2); ctx.fill();
  // 本体
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (wrongHit) { g.addColorStop(0, '#ff8aa0'); g.addColorStop(1, '#c4143c'); }
  else if (showAnswer) { g.addColorStop(0, '#8dffb0'); g.addColorStop(1, '#10a94a'); }
  else { g.addColorStop(0, c1); g.addColorStop(1, c2); }
  ctx.fillStyle = g; rr(x, y, w, h, 18 * p.s); ctx.fill();
  ctx.lineWidth = Math.max(2, (selected ? 7 : 3) * p.s);
  ctx.strokeStyle = selected ? '#ffffff' : 'rgba(255,255,255,.55)';
  if (selected) { ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 24 * p.s + 6; }
  rr(x, y, w, h, 18 * p.s); ctx.stroke(); ctx.shadowBlur = 0;
  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x + 8 * p.s, y + 8 * p.s, w - 16 * p.s, h * 0.28, 12 * p.s); ctx.fill();
  // 数字
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 6 * p.s;
  ctx.font = `bold ${Math.round(88 * p.s)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeText(String(b.num), p.x, y + h * 0.55); ctx.fillText(String(b.num), p.x, y + h * 0.55);
  ctx.globalAlpha = 1;
}
function drawShip() {
  const x = CX + laneF * LANE_W * 0.98, y = 548;
  const hurt = G && G.row && G.row.phase === 'resolve' && !G.row.ok && Math.floor(tAll * 16) % 2 === 0;
  if (hurt) return;
  ctx.save(); ctx.translate(x, y);
  // 炎
  const fl = 14 + Math.random() * 10;
  const fg = ctx.createLinearGradient(0, 18, 0, 18 + fl * 2);
  fg.addColorStop(0, '#ffe45e'); fg.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-12, 18); ctx.lineTo(0, 18 + fl * 2); ctx.lineTo(12, 18); ctx.fill();
  // 翼
  ctx.fillStyle = '#ff5aa5';
  ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-46, 24); ctx.lineTo(-44, 32); ctx.lineTo(-10, 22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(46, 24); ctx.lineTo(44, 32); ctx.lineTo(10, 22); ctx.closePath(); ctx.fill();
  // 機体
  const bg = ctx.createLinearGradient(-14, 0, 14, 0);
  bg.addColorStop(0, '#dfe8ff'); bg.addColorStop(0.5, '#ffffff'); bg.addColorStop(1, '#a9b8e8');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(0, -44); ctx.quadraticCurveTo(20, -4, 14, 24); ctx.lineTo(-14, 24); ctx.quadraticCurveTo(-20, -4, 0, -44); ctx.fill();
  ctx.fillStyle = '#4fc3ff'; ctx.beginPath(); ctx.ellipse(0, -8, 7, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawBeam() {
  const row = G.row;
  if (row.phase === 'resolve' && row.t < 0.18) {
    const idx = row.chosen, p = proj(row.blocks[idx].lane, DJ);
    const a = 1 - row.t / 0.18;
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = row.ok ? '#7df9ff' : '#ff6b88'; ctx.lineWidth = 12; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 24; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(CX + laneF * LANE_W * 0.98, 510); ctx.lineTo(p.x, p.y - 45 * p.s); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
  } else if (row.phase === 'approach') {
    // ねらい線
    const p = proj(lane, DJ);
    ctx.save(); ctx.setLineDash([8, 10]); ctx.lineDashOffset = -tAll * 60;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX + laneF * LANE_W * 0.98, 500); ctx.lineTo(p.x, p.y - 45 * p.s); ctx.stroke();
    ctx.restore();
  }
}
function drawHUD() {
  const row = G.row;
  // 問題
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12;
  const bw = 400, bh = 86, bx = CX - bw / 2, by = 18;
  const g = ctx.createLinearGradient(0, by, 0, by + bh);
  g.addColorStop(0, 'rgba(255,255,255,.96)'); g.addColorStop(1, 'rgba(210,225,255,.96)');
  ctx.fillStyle = g; rr(bx, by, bw, bh, 22); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#2a1466'; ctx.font = `bold 62px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${row.q.a} × ${row.q.b} = ？`, CX, by + bh / 2 + 3);
  // 時間ゲージ
  const frac = row.phase === 'approach' ? clamp((row.d - DJ) / (1 - DJ), 0, 1) : 0;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(bx, by + bh + 8, bw, 10, 5); ctx.fill();
  if (frac > 0) {
    ctx.fillStyle = frac > 0.5 ? '#7df9ff' : frac > 0.25 ? '#ffe45e' : '#ff6b88';
    rr(bx, by + bh + 8, bw * frac, 10, 5); ctx.fill();
  }
  // スコア
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  ctx.font = `bold 20px ${FONT}`; ctx.fillStyle = '#cfd8ff'; ctx.fillText('SCORE', 24, 30);
  ctx.font = `bold 40px ${FONT}`; ctx.fillStyle = '#ffe45e'; ctx.fillText(String(G.score), 24, 64);
  // コンボ
  if (G.combo >= 2) {
    ctx.font = `bold 26px ${FONT}`; ctx.fillStyle = '#ff7ae0';
    ctx.fillText(`🔥 ${G.combo} コンボ`, 24, 104);
    ctx.font = `bold 22px ${FONT}`; ctx.fillStyle = '#7df9ff';
    ctx.fillText(`ポイント ×${G.mult}`, 24, 134);
    // 次のボーナスまで
    if (G.mult < 5) {
      const n = G.combo % 5; ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(24, 144, 130, 8, 4); ctx.fill();
      ctx.fillStyle = '#ff7ae0'; rr(24, 144, 130 * n / 5, 8, 4); ctx.fill();
    }
  }
  // ライフ・進行
  ctx.textAlign = 'right'; ctx.font = `bold 20px ${FONT}`; ctx.fillStyle = '#cfd8ff';
  ctx.fillText(`もんだい ${Math.min(G.qIndex + 1, TOTAL_Q)} / ${TOTAL_Q}`, W - 24, 30);
  if (G.lives !== Infinity) {
    ctx.font = '34px sans-serif';
    let s = ''; for (let i = 0; i < 3; i++) s += i < G.lives ? '❤️' : '🖤';
    ctx.fillText(s, W - 24, 70);
  } else { ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = '#7df9ff'; ctx.fillText('れんしゅうモード', W - 24, 62); }
  ctx.shadowBlur = 0;
  // 不正解時の答え表示
  if (row.phase === 'resolve' && !row.ok) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(CX - 230, 275, 460, 74, 18); ctx.fill();
    ctx.fillStyle = '#8dffb0'; ctx.font = `bold 40px ${FONT}`;
    ctx.fillText(`${row.q.a} × ${row.q.b} = ${row.q.a * row.q.b}`, CX, 313);
  }
}
function drawMenuIdle() {
  // メニュー背景用にゆったり流す
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 30, (Math.random() - .5) * shake * 30);
  drawBackground(); drawFloor();
  if (state !== 'menu' && G && G.row) {
    const row = G.row;
    for (let i = 0; i < 3; i++) { const b = row.blocks[i]; if (b.alive) drawBlock(b, i, row); }
    drawBeam();
  }
  drawShip();
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life * 1.6, 0, 1);
    ctx.font = `bold ${f.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (state !== 'menu' && G && G.row) drawHUD();
  if (flash > 0) { ctx.globalAlpha = clamp(flash * 1.6, 0, 0.5); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.restore();
}

// ====================== メインループ ======================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
buildMenu();
requestAnimationFrame(frame);
})();
</script>
